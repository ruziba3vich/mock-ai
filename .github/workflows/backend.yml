name: Backend CI/CD

on:
  pull_request:
    paths:
      - "apps/api/**"
      - "deploy/vps/api/**"
      - ".github/workflows/backend.yml"
  push:
    branches: [main]
    paths:
      - "apps/api/**"
      - "deploy/vps/api/**"
      - ".github/workflows/backend.yml"
  workflow_dispatch:

concurrency:
  group: backend-production
  cancel-in-progress: false

env:
  IMAGE_REPOSITORY: ghcr.io/${{ github.repository_owner }}/mock-ai-api

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: mockai_ci
          POSTGRES_PASSWORD: ci-only-password
          POSTGRES_DB: mock_ai_learning_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U mockai_ci -d mock_ai_learning_test"
          --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: apps/api/go.mod
          cache-dependency-path: apps/api/go.sum
      - name: Test backend
        working-directory: apps/api
        env:
          MOCKAI_INTEGRATION: "1"
          DATABASE_URL: postgres://mockai_ci:ci-only-password@127.0.0.1:5432/mock_ai_learning_test?sslmode=disable
        run: go test ./...
      - name: Vet backend
        working-directory: apps/api
        run: go vet ./...

  publish:
    if: github.event_name != 'pull_request'
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    outputs:
      digest: ${{ steps.build.outputs.digest }}
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/metadata-action@v5
        id: metadata
        with:
          images: ${{ env.IMAGE_REPOSITORY }}
          tags: |
            type=sha,format=long
            type=raw,value=latest,enable={{is_default_branch}}
      - name: Build and push backend image
        id: build
        uses: docker/build-push-action@v6
        with:
          context: apps/api
          file: apps/api/Dockerfile
          platforms: linux/amd64
          push: true
          tags: ${{ steps.metadata.outputs.tags }}
          labels: ${{ steps.metadata.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          provenance: mode=max
          sbom: true

  deploy:
    if: github.event_name != 'pull_request'
    needs: publish
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v4
      - name: Configure SSH
        env:
          SSH_PRIVATE_KEY: ${{ secrets.VPS_SSH_PRIVATE_KEY }}
          SSH_KNOWN_HOSTS: ${{ secrets.VPS_KNOWN_HOSTS }}
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "$SSH_PRIVATE_KEY" > ~/.ssh/mock-ai
          chmod 600 ~/.ssh/mock-ai
          printf '%s\n' "$SSH_KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts
      - name: Update deployment files
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
        run: |
          ssh -i ~/.ssh/mock-ai "$VPS_USER@$VPS_HOST" 'mkdir -p ~/tools/mock-ai/api'
          rsync -az -e 'ssh -i ~/.ssh/mock-ai' deploy/vps/api/ "$VPS_USER@$VPS_HOST:tools/mock-ai/api/"
          ssh -i ~/.ssh/mock-ai "$VPS_USER@$VPS_HOST" 'chmod 700 ~/tools/mock-ai/api/deploy.sh'
      - name: Write backend environment
        env:
          DATABASE_URL: ${{ secrets.APP_DATABASE_URL }}
          SESSION_SECRET: ${{ secrets.APP_SESSION_SECRET }}
          WEB_ORIGIN: ${{ secrets.APP_WEB_ORIGIN }}
          ADMIN_ORIGIN: ${{ vars.APP_ADMIN_ORIGIN || 'https://mockai.admin.chessinsight.uz' }}
          AI_KEY_ENCRYPTION_KEY: ${{ secrets.APP_AI_KEY_ENCRYPTION_KEY }}
          GEMINI_WRITING_MODEL: ${{ vars.GEMINI_WRITING_MODEL || 'gemini-3.7-flash' }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_MINI_APP_URL: ${{ secrets.TELEGRAM_MINI_APP_URL }}
          GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID }}
          GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
          GOOGLE_REDIRECT_URL: ${{ secrets.GOOGLE_REDIRECT_URL }}
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
        run: |
          if [ -z "$DATABASE_URL" ] || [ -z "$SESSION_SECRET" ] || [ -z "$WEB_ORIGIN" ]; then
            echo "::error::APP_DATABASE_URL, APP_SESSION_SECRET, and APP_WEB_ORIGIN are required"
            exit 1
          fi
          if [ -n "$GOOGLE_CLIENT_ID$GOOGLE_CLIENT_SECRET$GOOGLE_REDIRECT_URL" ] && \
             { [ -z "$GOOGLE_CLIENT_ID" ] || [ -z "$GOOGLE_CLIENT_SECRET" ] || [ -z "$GOOGLE_REDIRECT_URL" ]; }; then
            echo "::error::Google OAuth requires GOOGLE_CLIENT_ID, GOOGLE_CLIENT_SECRET, and GOOGLE_REDIRECT_URL together"
            exit 1
          fi
          umask 077
          printf '%s\n' \
            "DATABASE_URL=$DATABASE_URL" \
            "SESSION_SECRET=$SESSION_SECRET" \
            "WEB_ORIGIN=$WEB_ORIGIN" \
            "ADMIN_ORIGIN=$ADMIN_ORIGIN" \
            "AI_KEY_ENCRYPTION_KEY=$AI_KEY_ENCRYPTION_KEY" \
            "GEMINI_WRITING_MODEL=$GEMINI_WRITING_MODEL" \
            "TELEGRAM_BOT_TOKEN=$TELEGRAM_BOT_TOKEN" \
            "TELEGRAM_MINI_APP_URL=$TELEGRAM_MINI_APP_URL" \
            "GOOGLE_CLIENT_ID=$GOOGLE_CLIENT_ID" \
            "GOOGLE_CLIENT_SECRET=$GOOGLE_CLIENT_SECRET" \
            "GOOGLE_REDIRECT_URL=$GOOGLE_REDIRECT_URL" \
            > /tmp/mock-ai-api.env
          rsync -az -e 'ssh -i ~/.ssh/mock-ai' /tmp/mock-ai-api.env "$VPS_USER@$VPS_HOST:tools/mock-ai/api/.env.next"
          ssh -i ~/.ssh/mock-ai "$VPS_USER@$VPS_HOST" 'chmod 600 ~/tools/mock-ai/api/.env.next && mv ~/tools/mock-ai/api/.env.next ~/tools/mock-ai/api/.env'
      - name: Log VPS in to GHCR
        env:
          GHCR_READ_TOKEN: ${{ secrets.GHCR_READ_TOKEN }}
          GHCR_USERNAME: ${{ github.repository_owner }}
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
        run: |
          if [ -n "$GHCR_READ_TOKEN" ]; then
            printf '%s' "$GHCR_READ_TOKEN" | ssh -i ~/.ssh/mock-ai "$VPS_USER@$VPS_HOST" "docker login ghcr.io -u '$GHCR_USERNAME' --password-stdin"
          fi
      - name: Deploy and verify
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
        run: |
          ssh -i ~/.ssh/mock-ai "$VPS_USER@$VPS_HOST" \
            "IMAGE_REPOSITORY='$IMAGE_REPOSITORY' IMAGE_TAG='sha-$GITHUB_SHA' ~/tools/mock-ai/api/deploy.sh"
