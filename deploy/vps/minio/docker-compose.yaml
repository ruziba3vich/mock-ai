services:
  minio:
    image: minio/minio:latest
    container_name: mock_ai_minio
    restart: unless-stopped
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
    command: server /data --console-address ":9001"
    volumes:
      - minio_data:/data
    networks:
      private:
        ipv4_address: 172.30.50.12
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 10s
      timeout: 5s
      retries: 10

networks:
  private:
    name: mock_ai_private
    external: true

volumes:
  minio_data:
    name: mock_ai_minio_data
