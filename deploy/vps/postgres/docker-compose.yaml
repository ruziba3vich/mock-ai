name: mock-ai-postgres

services:
  postgres:
    image: postgres:17-alpine
    container_name: mock_ai_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      private:
        ipv4_address: 172.30.50.10
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

networks:
  private:
    name: mock_ai_private
    external: true

volumes:
  postgres_data:
    name: mock_ai_postgres_data
    external: true
