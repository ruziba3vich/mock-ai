services:
  redis:
    image: redis:7-alpine
    container_name: mock_ai_redis
    restart: unless-stopped
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD}
    command: ["sh", "-c", "exec redis-server --appendonly yes --requirepass \"$$REDIS_PASSWORD\""]
    volumes:
      - redis_data:/data
    networks:
      private:
        ipv4_address: 172.30.50.11
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a \"$${REDIS_PASSWORD}\" ping | grep PONG"]
      interval: 5s
      timeout: 5s
      retries: 10

networks:
  private:
    name: mock_ai_private
    external: true

volumes:
  redis_data:
    name: mock_ai_redis_data
